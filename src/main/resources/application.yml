spring:
  application:
    name: article-create-project
  profiles:
    active: local
  # session ??
  session:
    store-type: redis
    # session 30 ???
    timeout: 2592000
  # Redis ??

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
server:
  port: 8181
  servlet:
    context-path: /api
    # cookie 30 ???
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi ??
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.shuhang.controller
# knife4j ??????
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

# 文章智能体配置
article:
  agent:
    orchestrator:
      # 是否启用多智能体编排模式（支持配图并行生成）
      # true: 使用 Spring AI Alibaba 多智能体编排
      # false: 使用原有的 ArticleAgentService
      enabled: true
    # Agent 最大迭代次数
    max-iterations: 10